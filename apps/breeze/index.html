<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breeze AI - ShimmerOS</title>
    <link rel="stylesheet" href="../../assets/css/themes.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/breeze.css">
    <script>
        const savedTheme = localStorage.getItem('ShimmerOS_theme') || 'lavender-light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>
        <!-- MENU BAR -->
    <div class="menu-bar">
        <div class="menu-left">
            <span class="menu-logo">🤖</span>
            <span class="menu-item">Breeze AI</span>
            <span class="menu-item">Edit</span>
            <span class="menu-item">View</span>
            <span class="menu-item">Window</span>
            <span class="menu-item">Help</span>
        </div>
        <div class="menu-right">
            <span class="menu-icon"><img src="../../assets/imgs/system-icons/butterfly.png" class="menu-img" alt="Butterfly"></span>
            <span class="menu-icon"><img src="../../assets/imgs/system-icons/battery-empty.png" class="menu-img" alt="Battery"></span>
            <span class="menu-icon"><img src="../../assets/imgs/system-icons/wifi-high.png" class="menu-img" alt="WiFi"></span>
            <span class="menu-icon"><img src="../../assets/imgs/system-icons/bluetooth.png" class="menu-img" alt="Bluetooth"></span>
            <span class="menu-icon"><img src="../../assets/imgs/system-icons/heart.png" class="menu-img" alt="Heart"></span>
            <span class="menu-icon"><img src="../../assets/imgs/system-icons/user-circle.png" class="menu-img" alt="User"></span>
            <span class="menu-icon" id="menuTime">Loading...</span>
        </div>
    </div>

    <!-- BREEZE WINDOW -->
    <div class="window" style="width: 1100px; max-height: 85vh;">
        <div class="window-bar">
            <div class="window-controls">
                <button class="control-btn close" onclick="window.location.href='../../home/index.html'"></button>
                <button class="control-btn minimize"></button>
                <button class="control-btn maximize"></button>
            </div>
            <span class="window-title">Breeze AI - Your Companion</span>
        </div>

        <div class="app-content">
            <div class="breeze-layout">
                
                <!-- LEFT SIDEBAR -->
                <div class="breeze-sidebar">
                    <!-- BREEZE AVATAR -->
                    <div class="breeze-avatar-card">
                        <div class="breeze-avatar">
                            <div class="avatar-center"><img src="../../assets/imgs/userdata/pfp.png" style="width: 100px; border-radius: 50%;"></div>
                        </div>
                        <h3 class="breeze-name">breeze</h3>
                        <p class="breeze-tagline">your context-aware companion</p>
                        <div class="breeze-status">
                            <span class="status-dot"></span>
                            <span class="status-text">online & learning</span>
                        </div>
                    </div>

                    <!-- CONTEXT INFO -->
                    <div class="context-card">
                        <h4 class="context-title">what i know about you</h4>
                        <div class="context-items">
                            <div class="context-item">
                                <span class="context-icon">📊</span>
                                <div class="context-info">
                                    <span class="context-label">daily logs</span>
                                    <span class="context-value" id="contextLogs">--</span>
                                </div>
                            </div>
                            <div class="context-item">
                                <span class="context-icon">📔</span>
                                <div class="context-info">
                                    <span class="context-label">diary entries</span>
                                    <span class="context-value" id="contextEntries">--</span>
                                </div>
                            </div>
                            <div class="context-item">
                                <span class="context-icon">📝</span>
                                <div class="context-info">
                                    <span class="context-label">assignments</span>
                                    <span class="context-value" id="contextAssignments">--</span>
                                </div>
                            </div>
                            <div class="context-item">
                                <span class="context-icon">🍋</span>
                                <div class="context-info">
                                    <span class="context-label">social posts</span>
                                    <span class="context-value" id="contextPosts">--</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- QUICK PROMPTS -->
                    <div class="quick-prompts">
                        <h4 class="prompts-title">quick questions</h4>
                        <button class="prompt-btn" onclick="sendToBotpress('How am I feeling today?')">
                            😊 how am i feeling?  
                        </button>
                        <button class="prompt-btn" onclick="sendToBotpress('Why does my stomach hurt?')">
                            🤕 why stomach pain?
                        </button>
                        <button class="prompt-btn" onclick="sendToBotpress('What assignments are due? ')">
                            📚 assignments due?
                        </button>
                        <button class="prompt-btn" onclick="sendToBotpress('Am I spending too much time on social media?')">
                            📱 screen time check?  
                        </button>
                        <button class="prompt-btn" onclick="sendToBotpress('What should I work on today?')">
                            ✨ what to focus on?
                        </button>
                    </div>
                </div>

                <!-- BOTPRESS IFRAME -->
                <div class="chat-container">
                    <iframe 
                        id="botpressFrame"
                        src="https://cdn.botpress.cloud/webchat/v3.5/shareable.html?configUrl=https://files.bpcontent.cloud/2025/12/21/19/20251221191004-TJQN419F.json"
                        style="
                            width: 100%;
                            height: 100%;
                            border: none;
                            background: transparent;
                        "
                        allow="microphone; camera"
                    ></iframe>
                </div>

            </div>
        </div>
    </div>

    <script src="../../assets/js/themes.js"></script>
    <script src="../../assets/js/breeze.js"></script>
    
    <script>
        // Send quick prompts to iframe
        function sendToBotpress(message) {
            const iframe = document.getElementById('botpressFrame');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({
                    type: 'sendMessage',
                    text: message
                }, '*');
            }
        }
        
        // Update time
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { 
                hour: 'numeric', 
                minute:  '2-digit',
                hour12: true 
            });
            document.getElementById('menuTime').textContent = timeString;
        }
        setInterval(updateTime, 1000);
        updateTime();
        
        // Load context stats
        async function loadContext() {
            try {
                const [catLogs, memoir, lemonure, Echoura] = await Promise.all([
                    fetch('../../assets/data/cat_logs.json').then(r => r.json()).catch(() => null),
                    fetch('../../assets/data/memoir_entries.json').then(r => r.json()).catch(() => null),
                    fetch('../../assets/data/lemonure_data.json').then(r => r.json()).catch(() => null),
                    fetch('../../assets/data/echoura_assignments.json').then(r => r.json()).catch(() => null)
                ]);
                
                document.getElementById('contextLogs').textContent = `${catLogs?.logs?.length || 0} days`;
                document.getElementById('contextEntries').textContent = `${memoir?.entries?.length || 0} entries`;
                document.getElementById('contextPosts').textContent = `${lemonure?.feed?.length || 0} posts`;
                
                let count = 0;
                Echoura?.courses?.forEach(c => count += c.assignments?.length || 0);
                document.getElementById('contextAssignments').textContent = `${count} total`;
            } catch (e) {
                console.error('Error loading context:', e);
            }
        }
        loadContext();
    </script>
</body>
</html>
